<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CampusSphere - All Complaints</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#0b1324;
            color:white;
            font-family:Arial, Helvetica, sans-serif;
        }

        .page-card{
            background:#1e293b;
            border:none;
            border-radius:20px;
            box-shadow:0 8px 20px rgba(0,0,0,0.25);
        }

        .toolbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:15px;
            margin-bottom:20px;
        }

        .toolbar .form-control,
        .toolbar .form-select{
            background:#0f172a;
            color:white;
            border:1px solid #334155;
            border-radius:12px;
        }

        .toolbar .form-control::placeholder{
            color:#94a3b8;
        }

        .table{
            color:white;
            margin-bottom:0;
        }

        .table thead{
            background:#0f172a;
            color:white;
        }

        .table tbody tr{
            transition:0.25s;
        }

        .table tbody tr:hover{
            background:rgba(59,130,246,0.08);
        }

        .table-responsive{
            border-radius:16px;
            overflow:hidden;
        }

        .top-title{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:25px;
        }

        .count-badge{
            background:#2563eb;
            padding:8px 16px;
            border-radius:12px;
            font-weight:600;
        }
    </style>
</head>

<body>

<div class="container-fluid p-4">

    <div class="page-card p-4">

        <div class="top-title">

            <div>
                <h2 class="mb-1">All Campus Complaints</h2>
                <p class="text-light mb-0">
                    View and monitor all submitted campus complaints
                </p>
            </div>

            <div class="count-badge">
                Total: <span th:text="${#lists.size(complaints)}">0</span>
            </div>

        </div>

        <!-- Toolbar -->
        <div class="toolbar">

            <input type="text"
                   id="searchInput"
                   class="form-control"
                   placeholder="Search complaints..."
                   style="max-width:300px;">

            <div class="d-flex gap-2">

                <select id="deptFilter" class="form-select">
                    <option value="">All Departments</option>
                    <option>BCA</option>
                    <option>IT</option>
                    <option>CSE</option>
                    <option>MBA</option>
                    <option>MCA</option>
                </select>

                <select id="statusFilter" class="form-select">
                    <option value="">All Status</option>
                    <option>Pending</option>
                    <option>In Progress</option>
                    <option>Resolved</option>
                </select>

            </div>

        </div>

        <!-- Table -->
        <div class="table-responsive">

            <table class="table table-hover align-middle" id="complaintTable">

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Student</th>
                    <th>Department</th>
                    <th>Issue</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Priority</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="c : ${complaints}">

                    <td th:text="${'CS-2026-' + (1000 + c.id)}"></td>

                    <td th:text="${c.studentName}"></td>

                    <td th:text="${c.department}"></td>

                    <td th:text="${c.issueType}"></td>

                    <td th:text="${c.description}"></td>

                    <td>

                        <span th:if="${c.status == 'Pending'}"
                              class="badge bg-warning text-dark"
                              th:text="${c.status}"></span>

                        <span th:if="${c.status == 'In Progress'}"
                              class="badge bg-info text-dark"
                              th:text="${c.status}"></span>

                        <span th:if="${c.status == 'Resolved'}"
                              class="badge bg-success"
                              th:text="${c.status}"></span>

                    </td>

                    <td>

                        <span th:if="${c.priority == 'Low'}"
                              class="badge bg-success"
                              th:text="${c.priority}"></span>

                        <span th:if="${c.priority == 'Medium'}"
                              class="badge bg-warning text-dark"
                              th:text="${c.priority}"></span>

                        <span th:if="${c.priority == 'High'}"
                              class="badge bg-danger"
                              th:text="${c.priority}"></span>

                        <span th:if="${c.priority == 'Critical'}"
                              class="badge bg-dark"
                              th:text="${c.priority}"></span>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

        <div class="text-center mt-4">

            <a href="/admin" class="btn btn-outline-light me-2">
                Back to Dashboard
            </a>

            <a href="/" class="btn btn-primary">
                Home
            </a>

        </div>

    </div>

</div>

<!-- Search + Filter -->
<script>
const searchInput = document.getElementById('searchInput');
const deptFilter = document.getElementById('deptFilter');
const statusFilter = document.getElementById('statusFilter');

function filterTable() {

    const search = searchInput.value.toLowerCase();
    const dept = deptFilter.value.toLowerCase();
    const status = statusFilter.value.toLowerCase();

    const rows = document.querySelectorAll('#complaintTable tbody tr');

    rows.forEach(row => {

        const text = row.innerText.toLowerCase();
        const department = row.cells[2].innerText.toLowerCase();
        const rowStatus = row.cells[5].innerText.toLowerCase();

        const matchSearch = text.includes(search);
        const matchDept = dept === '' || department === dept;
        const matchStatus = status === '' || rowStatus === status;

        row.style.display =
            (matchSearch && matchDept && matchStatus)
            ? ''
            : 'none';

    });
}

searchInput.addEventListener('keyup', filterTable);
deptFilter.addEventListener('change', filterTable);
statusFilter.addEventListener('change', filterTable);
</script>

</body>
</html>
