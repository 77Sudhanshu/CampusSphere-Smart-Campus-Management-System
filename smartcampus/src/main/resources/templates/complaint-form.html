<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Submit Complaint</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">Submit Campus Complaint</h2>

    <form action="/submit" method="post" th:object="${complaint}" class="card p-4 shadow">

        <div class="alert alert-primary d-flex justify-content-between align-items-center">
    <div>
        <strong>Student:</strong> Sudhanshu Bhardwaj<br>
        <strong>Department:</strong> BCA
    </div>

    <span class="badge bg-success fs-6">Verified Student</span>

    <!-- Hidden fields sent to backend -->
    <input type="hidden" th:field="*{studentName}" value="Sudhanshu Bhardwaj">
    <input type="hidden" th:field="*{department}" value="BCA">
</div>

        <div class="mb-3">
    <label class="form-label">Issue Type</label>

    <select th:field="*{issueType}" class="form-select">
        <option value="Wi-Fi">📶 Wi-Fi</option>
        <option value="Electricity">⚡ Electricity</option>
        <option value="Library">📚 Library</option>
        <option value="Classroom">🏫 Classroom</option>
        <option value="Hostel">🏠 Hostel</option>
        <option value="Water Supply">🚰 Water Supply</option>
        <option value="Cleanliness">🧹 Cleanliness</option>
        <option value="Other">📝 Other</option>
    </select>
</div>
<div class="mb-3">
    <label class="form-label">Priority</label>
    <select th:field="*{priority}" class="form-select">
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
        <option value="Critical">Critical</option>
    </select>
</div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Submit Complaint</button>
    </form>
</div>

</body>
</html>
