<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Track Complaint - CampusSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            background:#f1f5f9;
            font-family:Arial, Helvetica, sans-serif;
        }

        .track-card{
            max-width:650px;
            margin:auto;
            margin-top:60px;
            background:white;
            border-radius:20px;
            padding:35px;
            box-shadow:0 10px 25px rgba(0,0,0,0.08);
        }

        .result-card{
            border-radius:16px;
            border:1px solid #e5e7eb;
        }
    </style>
</head>
<body>

<div class="track-card">

    <h2 class="text-center text-primary mb-4">Track Complaint Status</h2>

    <form action="/track" method="post">

        <div class="mb-3">

            <label class="form-label">Complaint ID</label>

            <input type="number"
                   name="complaintId"
                   class="form-control"
                   placeholder="Enter your complaint ID"
                   required>

        </div>

        <button type="submit" class="btn btn-primary w-100">
            Track Complaint
        </button>

    </form>

    <div th:if="${complaint}" class="card result-card mt-4">
        <div class="card-body">

            <h4 class="text-success mb-3">Complaint Found</h4>

            <p><strong>ID:</strong> <span th:text="${complaint.id}"></span></p>

            <p><strong>Student:</strong> <span th:text="${complaint.studentName}"></span></p>

            <p><strong>Department:</strong> <span th:text="${complaint.department}"></span></p>

            <p><strong>Issue Type:</strong> <span th:text="${complaint.issueType}"></span></p>

            <p><strong>Priority:</strong> <span th:text="${complaint.priority}"></span></p>

            <p><strong>Status:</strong> <span th:text="${complaint.status}"></span></p>

        </div>
    </div>

    <div th:if="${error}" class="alert alert-danger mt-4" th:text="${error}"></div>

    <div class="text-center mt-4">
        <a href="/" class="btn btn-secondary">Back to Home</a>
    </div>

</div>

</body>
</html>
