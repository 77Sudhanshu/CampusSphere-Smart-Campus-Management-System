<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Complaint Submitted Successfully</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f1f5f9;
            font-family:Arial, Helvetica, sans-serif;
        }

        .success-card{
            max-width:700px;
            margin:80px auto;
            background:white;
            border-radius:20px;
            padding:40px;
            box-shadow:0 10px 30px rgba(0,0,0,0.08);
        }

        .check{
            font-size:70px;
            color:#16a34a;
        }

        .ticket{
            background:#eff6ff;
            border:1px solid #bfdbfe;
            border-radius:16px;
            padding:20px;
            margin:25px 0;
        }

        .ticket h2{
            color:#1d4ed8;
            font-weight:700;
            margin:0;
        }

        .btn-rounded{
            border-radius:999px;
            padding:12px 22px;
        }
    </style>
</head>
<body>

<div class="success-card text-center">

    <div class="check">✔</div>

    <h2 class="mt-3">Complaint Submitted Successfully</h2>

    <p class="text-muted">
        Your complaint has been registered in the CampusSphere system.
        Please use the Complaint ID below for future tracking.
    </p>

    <div class="ticket">

        <small class="text-muted">Complaint ID</small>

        <h2 th:text="${complaintId}">CS-2026-1001</h2>

        <div class="row mt-3">

            <div class="col-md-6">
                <strong>Status:</strong>
                <span class="badge bg-warning text-dark"
                      th:text="${status}">Pending</span>
            </div>

            <div class="col-md-6">
                <strong>Priority:</strong>
                <span class="badge bg-info text-dark"
                      th:text="${priority}">Medium</span>
            </div>

        </div>

    </div>

    <div class="d-flex justify-content-center gap-3 flex-wrap">

        <a href="/track" class="btn btn-success btn-rounded">
            Track Complaint
        </a>

        <a href="/student-dashboard" class="btn btn-primary btn-rounded">
            Student Dashboard
        </a>

        <a href="/complaint" class="btn btn-outline-primary btn-rounded">
            Submit Another
        </a>

    </div>

</div>

</body>
</html>
